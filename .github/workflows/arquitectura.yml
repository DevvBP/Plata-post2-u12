name: Verificacion de Reglas Arquitectonicas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  arquitectura:
    name: Validar Arquitectura con ArchUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas de arquitectura y suite completa
        id: maven-test
        run: mvn test --batch-mode --no-transfer-progress > maven_output.log 2>&1
        working-directory: sistema-pedidos
        continue-on-error: true

      - name: Hacer push del log si hay error
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add sistema-pedidos/maven_output.log
          git commit -m "chore: save maven log" || echo "No changes"
          git push
